<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tsundoku Scan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #eee;
    }

    /* Steps */
    .step { display: none; width: 100%; height: 100%; }
    .step.active { display: flex; flex-direction: column; }

    /* Step: Mode selector */
    #step-mode {
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      padding: 20px;
      gap: 20px;
    }
    #step-mode h1 { font-size: 1.4rem; }
    .mode-btn {
      background: rgba(255,255,255,0.1);
      color: #eee;
      border: 1.5px solid rgba(255,255,255,0.2);
      padding: 20px 30px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      width: 80%;
      max-width: 300px;
      text-align: center;
    }
    .mode-btn .mode-title { font-weight: bold; margin-bottom: 4px; }
    .mode-btn .mode-desc { font-size: 0.8rem; color: #aaa; }

    /* Step: QR Scanner (live mode) */
    #step-scan {
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      padding: 20px;
    }
    #step-scan h1 { font-size: 1.2rem; margin-bottom: 16px; }
    #qr-reader { width: 100%; max-width: 400px; }
    #scan-status { margin-top: 12px; font-size: 0.9rem; color: #aaa; }

    /* Step: Barcode Scanner (offline mode) */
    #step-barcode {
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      padding: 20px;
    }
    #step-barcode h1 { font-size: 1.2rem; margin-bottom: 16px; }
    #barcode-reader { width: 100%; max-width: 400px; }
    #barcode-status { margin-top: 12px; font-size: 0.9rem; color: #aaa; }

    /* Step: Camera — fullscreen viewfinder */
    #step-camera { position: relative; }
    #camera-feed {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 12px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,0.7) 30%);
    }
    .category-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .cat-btn {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.3);
      padding: 14px 4px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: transform 0.1s;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
    }
    .cat-btn:active { transform: scale(0.92); }
    .cat-btn:disabled { opacity: 0.3; }

    /* TOC page counter */
    .toc-bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .toc-bar.visible { display: flex; }
    .toc-count {
      font-size: 0.85rem;
      color: #fff;
      background: rgba(59,130,246,0.5);
      padding: 4px 12px;
      border-radius: 12px;
    }
    .toc-send-btn {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .toc-send-btn:disabled { opacity: 0.5; }
    .toc-reset-btn {
      background: rgba(255,255,255,0.15);
      color: #ddd;
      border: 1.5px solid rgba(255,255,255,0.25);
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .toc-reset-btn:disabled { opacity: 0.5; }

    /* Offline bar — new book button */
    .offline-bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .offline-bar.visible { display: flex; }
    .new-book-btn {
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: bold;
    }

    /* Flash overlay for capture feedback */
    .flash {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.05s;
    }
    .flash.fire { opacity: 0.6; transition: none; }

    /* Toast notification */
    .toast {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
    }
    .toast.show { opacity: 1; }
    .resource-id {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
    }
    .top-left-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
    }
    .mode-badge {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(245,158,11,0.6);
      color: #fff;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Step: Mode selector -->
  <div id="step-mode" class="step active">
    <h1>Tsundoku Scan</h1>
    <button class="mode-btn" onclick="startLiveMode()">
      <div class="mode-title">Live Session</div>
      <div class="mode-desc">Scan QR code from computer to pair</div>
    </button>
    <button class="mode-btn" onclick="startOfflineMode()">
      <div class="mode-title">Offline Capture</div>
      <div class="mode-desc">Scan book barcode, capture pages for later</div>
    </button>
  </div>

  <!-- Step: QR Scanner (live mode) -->
  <div id="step-scan" class="step">
    <h1>Scan QR Code</h1>
    <div id="qr-reader"></div>
    <div id="scan-status">Point your camera at the QR code</div>
  </div>

  <!-- Step: Barcode Scanner (offline mode) -->
  <div id="step-barcode" class="step">
    <h1>Scan Book Barcode</h1>
    <div id="barcode-reader"></div>
    <div id="barcode-status">Point your camera at the book's barcode</div>
  </div>

  <!-- Step: Camera — fullscreen -->
  <div id="step-camera" class="step">
    <video id="camera-feed" autoplay playsinline muted></video>
    <button class="top-left-btn" id="back-btn" onclick="goBack()">Back</button>
    <div class="mode-badge" id="mode-badge">OFFLINE</div>
    <div class="resource-id" id="resource-id"></div>
    <div class="flash" id="flash"></div>
    <div class="toast" id="toast"></div>
    <div class="camera-overlay">
      <div class="category-row">
        <button class="cat-btn" data-cat="cover" data-multi="false">Cover</button>
        <button class="cat-btn" data-cat="summary" data-multi="false">Summary</button>
        <button class="cat-btn selected" data-cat="title_page" data-multi="false">Title<br>Page</button>
        <button class="cat-btn" data-cat="copyright" data-multi="false">Copyright</button>
        <span></span>
        <button class="cat-btn" data-cat="ocr" data-multi="false">Just<br>OCR</button>
        <button class="cat-btn" data-cat="toc" data-multi="true">TOC</button>
        <button class="cat-btn" data-cat="back_cover" data-multi="false">Back<br>Cover</button>
      </div>
      <div class="toc-bar" id="toc-bar">
        <button class="toc-reset-btn" id="toc-reset-btn" onclick="resetToc()" disabled>Reset</button>
        <span class="toc-count" id="toc-count">0 pages</span>
        <button class="toc-send-btn" id="toc-send-btn" onclick="sendTocBundle()" disabled>Send All</button>
      </div>
      <div class="offline-bar" id="offline-bar">
        <button class="new-book-btn" onclick="newBook()">New Book</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="tsundoku-scan.js"></script>
  <script>
    const PROCESS_URL = "https://xdcgxaq95i.execute-api.us-east-1.amazonaws.com/prod/process";
    const WS_ENDPOINT = "https://0xwe3mmkea.execute-api.us-east-1.amazonaws.com/prod";

    let pairingData = null;
    let camera = null;
    let selectedCategory = "copyright";
    let isMultiPage = false;
    let qrScanner = null;
    let barcodeScanner = null;
    let tocPages = [];
    let capturing = false;
    let mode = "live"; // "live" or "offline"

    // Category buttons: tap to capture
    document.querySelectorAll(".cat-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (capturing || !camera) return;

        const cat = btn.dataset.cat;
        const multi = btn.dataset.multi === "true";

        selectedCategory = cat;
        isMultiPage = multi;
        document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");

        const tocBar = document.getElementById("toc-bar");
        if (multi) {
          tocBar.classList.add("visible");
        } else {
          tocBar.classList.remove("visible");
        }

        await capturePhoto();
      });
    });

    function showStep(id) {
      document.querySelectorAll(".step").forEach((s) => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function showToast(msg, duration = 2000) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), duration);
    }

    function flashScreen() {
      const el = document.getElementById("flash");
      el.classList.add("fire");
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          el.classList.remove("fire");
        });
      });
    }

    function updateTocCount() {
      document.getElementById("toc-count").textContent =
        tocPages.length + (tocPages.length === 1 ? " page" : " pages");
      document.getElementById("toc-send-btn").disabled = tocPages.length === 0;
      document.getElementById("toc-reset-btn").disabled = tocPages.length === 0;
    }

    function resetToc() {
      tocPages = [];
      updateTocCount();
      showToast("Reset");
    }

    // ---- Mode selection ----

    function startLiveMode() {
      mode = "live";
      document.getElementById("mode-badge").style.display = "none";
      document.getElementById("offline-bar").classList.remove("visible");
      showStep("step-scan");
      startQRScanner();
    }

    function startOfflineMode() {
      mode = "offline";
      document.getElementById("mode-badge").style.display = "";
      document.getElementById("offline-bar").classList.add("visible");
      showStep("step-barcode");
      startBarcodeScanner();
    }

    function goBack() {
      if (camera) camera.stop();
      pairingData = null;
      tocPages = [];
      window.history.replaceState({}, "", window.location.pathname);
      if (mode === "offline") {
        showStep("step-barcode");
        startBarcodeScanner();
      } else {
        showStep("step-scan");
        startQRScanner();
      }
    }

    function newBook() {
      if (camera) camera.stop();
      tocPages = [];
      updateTocCount();
      showStep("step-barcode");
      startBarcodeScanner();
    }

    // ---- QR scanning (live mode) ----

    async function startQRScanner() {
      qrScanner = new Html5Qrcode("qr-reader");
      try {
        await qrScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onQRScanned,
          () => {}
        );
      } catch (err) {
        document.getElementById("scan-status").textContent = "Camera error: " + err;
      }
    }

    async function checkConnection(cid) {
      try {
        const checkUrl = PROCESS_URL.replace(/\/process$/, "/check") + "?cid=" + encodeURIComponent(cid);
        const resp = await fetch(checkUrl);
        const data = await resp.json();
        return data.alive;
      } catch {
        return true;
      }
    }

    async function pair(data) {
      pairingData = data;

      if (mode === "live" && data.connectionId) {
        const alive = await checkConnection(data.connectionId);
        if (!alive) {
          window.history.replaceState({}, "", window.location.pathname);
          document.getElementById("scan-status").textContent = "Session expired — scan a new QR code";
          showStep("step-scan");
          startQRScanner();
          return;
        }
      }

      document.getElementById("resource-id").textContent = pairingData.resourceId || "";
      showStep("step-camera");
      startCamera();
    }

    async function onQRScanned(decodedText) {
      let data;
      try {
        data = JSON.parse(decodedText);
      } catch {
        try {
          const url = new URL(decodedText);
          data = {
            connectionId: url.searchParams.get("cid"),
            resourceId: url.searchParams.get("rid") || "",
          };
        } catch {
          return;
        }
      }
      if (!data.connectionId) return;
      await qrScanner.stop();
      qrScanner = null;
      pair(data);
    }

    // ---- Barcode scanning (offline mode) ----

    async function startBarcodeScanner() {
      barcodeScanner = new Html5Qrcode("barcode-reader");
      try {
        await barcodeScanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 150 },
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E,
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
            ],
          },
          onBarcodeScanned,
          () => {}
        );
      } catch (err) {
        document.getElementById("barcode-status").textContent = "Camera error: " + err;
      }
    }

    async function onBarcodeScanned(decodedText) {
      // Strip whitespace — LCCN barcodes often encode a leading space
      const cleaned = (decodedText || "").replace(/\s+/g, "");
      if (!cleaned) return;

      await barcodeScanner.stop();
      barcodeScanner = null;
      pairingData = {
        connectionId: null,
        resourceId: cleaned,
      };
      document.getElementById("resource-id").textContent = cleaned;
      showStep("step-camera");
      startCamera();
    }

    // ---- Camera ----

    async function startCamera() {
      const video = document.getElementById("camera-feed");
      camera = new TsundokuCamera(video);
      try {
        await camera.start();
      } catch (err) {
        showToast("Camera error: " + err.message, 5000);
      }
    }

    // ---- Capture ----

    async function capturePhoto() {
      capturing = true;
      document.querySelectorAll(".cat-btn").forEach((b) => b.disabled = true);
      flashScreen();

      const dataUrl = camera.capture(0.95);

      if (isMultiPage) {
        tocPages.push(dataUrl);
        updateTocCount();
        showToast("Page " + tocPages.length + " captured");
      } else {
        showToast("Sending...");
        try {
          await sendPhoto(
            PROCESS_URL,
            pairingData.connectionId,
            dataUrl,
            selectedCategory,
            pairingData.resourceId
          );
          showToast("Sent!");
        } catch (err) {
          showToast("Failed: " + err.message, 3000);
        }
      }

      document.querySelectorAll(".cat-btn").forEach((b) => b.disabled = false);
      capturing = false;
    }

    // Send bundled TOC pages
    function dataUrlToBlob(dataUrl) {
      const [header, b64] = dataUrl.split(",");
      const mime = header.match(/:(.*?);/)[1];
      const bytes = atob(b64);
      const arr = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    async function sendTocBundle() {
      const btn = document.getElementById("toc-send-btn");
      btn.disabled = true;
      const count = tocPages.length;
      showToast("Requesting upload URLs...");

      try {
        // Step 1: get presigned upload URLs
        const uploadEndpoint = PROCESS_URL.replace(/\/process$/, "/upload");
        const uploadResp = await fetch(uploadEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            rid: pairingData.resourceId || "",
            category: "toc",
            count: count,
          }),
        });
        const uploadData = await uploadResp.json();
        if (uploadData.error) {
          showToast("Error: " + uploadData.error, 3000);
          btn.disabled = false;
          return;
        }
        const uploads = uploadData.uploads;

        // Step 2: PUT each photo to S3 in parallel
        showToast("Uploading " + count + " pages...");
        await Promise.all(uploads.map((u, i) => {
          const blob = dataUrlToBlob(tocPages[i]);
          return fetch(u.url, {
            method: "PUT",
            headers: { "Content-Type": "image/jpeg" },
            body: blob,
          }).then((r) => {
            if (!r.ok) throw new Error("Upload failed: " + r.status);
          });
        }));

        // Step 3: trigger processing with the s3 keys
        showToast("Processing...");
        const procResp = await fetch(PROCESS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            connectionId: pairingData.connectionId,
            s3_keys: uploads.map((u) => u.key),
            category: selectedCategory,
            resourceId: pairingData.resourceId || "",
          }),
        });
        const result = await procResp.json();
        if (result.error) {
          showToast("Error: " + result.error, 3000);
        } else {
          showToast("Sent " + count + " pages!");
          tocPages = [];
          updateTocCount();
        }
      } catch (err) {
        showToast("Failed: " + err.message, 3000);
      }
      btn.disabled = false;
    }

    // ---- Init ----
    const params = new URLSearchParams(window.location.search);
    if (params.get("cid")) {
      mode = "live";
      document.getElementById("mode-badge").style.display = "none";
      document.getElementById("offline-bar").classList.remove("visible");
      pair({
        connectionId: params.get("cid"),
        resourceId: params.get("rid") || "",
      });
    } else {
      showStep("step-mode");
    }
  </script>
</body>
</html>
