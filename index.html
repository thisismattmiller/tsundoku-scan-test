<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tsundoku Scan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #eee;
    }

    /* Steps */
    .step { display: none; width: 100%; height: 100%; }
    .step.active { display: flex; flex-direction: column; }

    /* Step 1: QR Scanner */
    #step-scan {
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      padding: 20px;
    }
    #step-scan h1 { font-size: 1.2rem; margin-bottom: 16px; }
    #qr-reader { width: 100%; max-width: 400px; }
    #scan-status { margin-top: 12px; font-size: 0.9rem; color: #aaa; }

    /* Step 2: Camera — fullscreen viewfinder */
    #step-camera { position: relative; }
    #camera-feed {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 12px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,0.7) 30%);
    }
    .category-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .cat-btn {
      background: rgba(255,255,255,0.15);
      color: #ddd;
      border: 1.5px solid rgba(255,255,255,0.25);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: transform 0.1s;
    }
    .cat-btn:active { transform: scale(0.92); }
    .cat-btn:disabled { opacity: 0.3; }

    /* TOC page counter */
    .toc-bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .toc-bar.visible { display: flex; }
    .toc-count {
      font-size: 0.85rem;
      color: #fff;
      background: rgba(59,130,246,0.5);
      padding: 4px 12px;
      border-radius: 12px;
    }
    .toc-send-btn {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .toc-send-btn:disabled { opacity: 0.5; }
    .toc-reset-btn {
      background: rgba(255,255,255,0.15);
      color: #ddd;
      border: 1.5px solid rgba(255,255,255,0.25);
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .toc-reset-btn:disabled { opacity: 0.5; }

    /* Flash overlay for capture feedback */
    .flash {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.05s;
    }
    .flash.fire { opacity: 0.6; transition: none; }

    /* Toast notification */
    .toast {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
    }
    .toast.show { opacity: 1; }
    .resource-id {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
    }
    .rescan-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- Step 1: Scan QR code -->
  <div id="step-scan" class="step active">
    <h1>Tsundoku Scan</h1>
    <div id="qr-reader"></div>
    <div id="scan-status">Point your camera at the QR code</div>
  </div>

  <!-- Step 2: Camera — fullscreen -->
  <div id="step-camera" class="step">
    <video id="camera-feed" autoplay playsinline muted></video>
    <button class="rescan-btn" onclick="rescan()">Re-scan QR</button>
    <div class="resource-id" id="resource-id"></div>
    <div class="flash" id="flash"></div>
    <div class="toast" id="toast"></div>
    <div class="camera-overlay">
      <div class="category-row">
        <button class="cat-btn selected" data-cat="copyright" data-multi="false">Copyright</button>
        <button class="cat-btn" data-cat="toc" data-multi="true">TOC</button>
        <button class="cat-btn" data-cat="back_cover" data-multi="false">Back Cover</button>
        <button class="cat-btn" data-cat="cover" data-multi="false">Cover</button>
        <button class="cat-btn" data-cat="summary" data-multi="false">Summary</button>
      </div>
      <div class="toc-bar" id="toc-bar">
        <button class="toc-reset-btn" id="toc-reset-btn" onclick="resetToc()" disabled>Reset</button>
        <span class="toc-count" id="toc-count">0 pages</span>
        <button class="toc-send-btn" id="toc-send-btn" onclick="sendTocBundle()" disabled>Send All</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="tsundoku-scan.js"></script>
  <script>
    // Hardcoded endpoints — no need to pass these through the QR code
    const PROCESS_URL = "https://xdcgxaq95i.execute-api.us-east-1.amazonaws.com/prod/process";
    const WS_ENDPOINT = "https://0xwe3mmkea.execute-api.us-east-1.amazonaws.com/prod";

    let pairingData = null;
    let camera = null;
    let selectedCategory = "copyright";
    let isMultiPage = false;
    let qrScanner = null;
    let tocPages = []; // collected TOC page data URLs

    let capturing = false;

    // Category buttons: tap to capture
    document.querySelectorAll(".cat-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (capturing || !camera) return;

        const cat = btn.dataset.cat;
        const multi = btn.dataset.multi === "true";

        // Update selection state
        selectedCategory = cat;
        isMultiPage = multi;
        document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");

        // Show/hide TOC bar
        const tocBar = document.getElementById("toc-bar");
        if (multi) {
          tocBar.classList.add("visible");
        } else {
          tocBar.classList.remove("visible");
        }

        // Capture
        await capturePhoto();
      });
    });

    function showStep(id) {
      document.querySelectorAll(".step").forEach((s) => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function showToast(msg, duration = 2000) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), duration);
    }

    function flashScreen() {
      const el = document.getElementById("flash");
      el.classList.add("fire");
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          el.classList.remove("fire");
        });
      });
    }

    function updateTocCount() {
      document.getElementById("toc-count").textContent =
        tocPages.length + (tocPages.length === 1 ? " page" : " pages");
      document.getElementById("toc-send-btn").disabled = tocPages.length === 0;
      document.getElementById("toc-reset-btn").disabled = tocPages.length === 0;
    }

    function resetToc() {
      tocPages = [];
      updateTocCount();
      showToast("Reset");
    }

    function rescan() {
      if (camera) camera.stop();
      pairingData = null;
      tocPages = [];
      // Clear URL params so refresh doesn't skip back to camera
      window.history.replaceState({}, "", window.location.pathname);
      showStep("step-scan");
      startQRScanner();
    }

    // QR scanning
    async function startQRScanner() {
      qrScanner = new Html5Qrcode("qr-reader");
      try {
        await qrScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onQRScanned,
          () => {}
        );
      } catch (err) {
        document.getElementById("scan-status").textContent = "Camera error: " + err;
      }
    }

    async function checkConnection(cid) {
      try {
        const checkUrl = PROCESS_URL.replace(/\/process$/, "/check") + "?cid=" + encodeURIComponent(cid);
        const resp = await fetch(checkUrl);
        const data = await resp.json();
        return data.alive;
      } catch {
        return true; // can't check, assume ok
      }
    }

    async function pair(data) {
      pairingData = data;

      // Check if connection is still alive
      const alive = await checkConnection(data.connectionId);
      if (!alive) {
        // Clear stale params and show scanner with message
        window.history.replaceState({}, "", window.location.pathname);
        document.getElementById("scan-status").textContent = "Session expired — scan a new QR code";
        showStep("step-scan");
        startQRScanner();
        return;
      }

      document.getElementById("resource-id").textContent = pairingData.resourceId || "";
      showStep("step-camera");
      startCamera();
    }

    async function onQRScanned(decodedText) {
      let data;
      try {
        data = JSON.parse(decodedText);
      } catch {
        try {
          const url = new URL(decodedText);
          data = {
            connectionId: url.searchParams.get("cid"),
            resourceId: url.searchParams.get("rid") || "",
          };
        } catch {
          return;
        }
      }
      if (!data.connectionId) return;
      await qrScanner.stop();
      qrScanner = null;
      pair(data);
    }

    // Camera
    async function startCamera() {
      const video = document.getElementById("camera-feed");
      camera = new TsundokuCamera(video);
      try {
        await camera.start();
      } catch (err) {
        showToast("Camera error: " + err.message, 5000);
      }
    }

    // Capture
    async function capturePhoto() {
      capturing = true;
      document.querySelectorAll(".cat-btn").forEach((b) => b.disabled = true);
      flashScreen();

      const dataUrl = camera.capture(0.85);

      if (isMultiPage) {
        tocPages.push(dataUrl);
        updateTocCount();
        showToast("Page " + tocPages.length + " captured");
      } else {
        showToast("Sending...");
        try {
          await sendPhoto(
            PROCESS_URL,
            pairingData.connectionId,
            dataUrl,
            selectedCategory,
            pairingData.resourceId
          );
          showToast("Sent!");
        } catch (err) {
          showToast("Failed: " + err.message, 3000);
        }
      }

      document.querySelectorAll(".cat-btn").forEach((b) => b.disabled = false);
      capturing = false;
    }

    // Send bundled TOC pages
    async function sendTocBundle() {
      const btn = document.getElementById("toc-send-btn");
      btn.disabled = true;
      showToast("Sending " + tocPages.length + " pages...");

      try {
        const resp = await fetch(PROCESS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            connectionId: pairingData.connectionId,
            images: tocPages,
            category: "toc",
            resourceId: pairingData.resourceId || "",
          }),
        });
        const result = await resp.json();
        if (result.error) {
          showToast("Error: " + result.error, 3000);
        } else {
          showToast("Sent " + tocPages.length + " pages!");
          tocPages = [];
          updateTocCount();
        }
      } catch (err) {
        showToast("Failed: " + err.message, 3000);
      }
      btn.disabled = false;
    }

    // Init
    const params = new URLSearchParams(window.location.search);
    if (params.get("cid")) {
      pair({
        connectionId: params.get("cid"),
        resourceId: params.get("rid") || "",
      });
    } else {
      startQRScanner();
    }
  </script>
</body>
</html>
